name: Publish isolated preview APT smoke package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: getpatched-public-apt-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preview Worker and package scripts
        run: |
          node --check worker/src/preview-apt.js
          node --test worker/test/preview-apt.test.js
          python3 -B -m unittest verification.test_preview_apt -v
          python3 -m py_compile scripts/build-preview-apt.py scripts/sign-preview-apt.py
      - name: Build the test-only Focal repository
        env:
          GETPATCHED_PREVIEW_VERSION: 0.1.0+preview1.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev xz-utils
          python3 scripts/build-preview-apt.py --output preview-repository --version "$GETPATCHED_PREVIEW_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: getpatched-preview-apt-unsigned
          path: preview-repository/
          if-no-files-found: error
          retention-days: 7

  deploy-preview-worker:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: getpatched-apt-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the isolated read-only preview Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: worker
      - name: Check the preview route
        run: curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 --max-time 20 https://preview.getpatched.dev/healthz

  publish-preview:
    needs: [build, deploy-preview-worker]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: getpatched-apt-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: getpatched-preview-apt-unsigned
          path: preview-repository
      - name: Install signing and R2 upload tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends awscli gnupg
      - name: Sign preview indexes with the dedicated preview key
        env:
          GETPATCHED_PREVIEW_SIGNING_KEY_ARMORED: ${{ secrets.GETPATCHED_PREVIEW_SIGNING_KEY_ARMORED }}
          GETPATCHED_PREVIEW_SIGNING_FINGERPRINT: ${{ vars.GETPATCHED_PREVIEW_SIGNING_FINGERPRINT }}
        run: python3 scripts/sign-preview-apt.py --repository preview-repository
      - name: Upload immutable preview files, then atomically activate signed metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GETPATCHED_PREVIEW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GETPATCHED_PREVIEW_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          GETPATCHED_PREVIEW_R2_ENDPOINT: ${{ vars.GETPATCHED_PREVIEW_R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GETPATCHED_PREVIEW_R2_ENDPOINT"
          bucket="s3://getpatched-apt-preview"
          repository_prefix="$bucket/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          aws s3 cp preview-repository/ "$repository_prefix/" --recursive --exclude 'dists/focal/InRelease' --endpoint-url "$GETPATCHED_PREVIEW_R2_ENDPOINT"
          aws s3 cp preview-repository/dists/focal/InRelease "$repository_prefix/dists/focal/InRelease" --endpoint-url "$GETPATCHED_PREVIEW_R2_ENDPOINT"

  verify-clean-focal-client:
    needs: publish-preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ubuntu:20.04
    env:
      GETPATCHED_PREVIEW_SIGNING_FINGERPRINT: ${{ vars.GETPATCHED_PREVIEW_SIGNING_FINGERPRINT }}
      GETPATCHED_PREVIEW_VERSION: 0.1.0+preview1.${{ github.run_id }}.${{ github.run_attempt }}
      GETPATCHED_PREVIEW_REPOSITORY_BASE: https://preview.getpatched.dev/runs/${{ github.run_id }}/${{ github.run_attempt }}
    steps:
      - name: Install clean-client verification tools
        run: |
          sed -i -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sed -i 's|^deb http://old-releases.ubuntu.com/ubuntu|deb [check-valid-until=no] http://old-releases.ubuntu.com/ubuntu|' /etc/apt/sources.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates curl dpkg-dev gnupg
      - name: Verify preview key, signature, package installation, and source retrieval
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GETPATCHED_PREVIEW_SIGNING_FINGERPRINT"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --output /tmp/getpatched-preview-key.asc "$GETPATCHED_PREVIEW_REPOSITORY_BASE/getpatched-preview-archive-keyring.asc"
          actual_fingerprint="$(gpg --batch --show-keys --with-colons /tmp/getpatched-preview-key.asc | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          test "$actual_fingerprint" = "${GETPATCHED_PREVIEW_SIGNING_FINGERPRINT^^}"
          gpg --batch --dearmor --output /usr/share/keyrings/getpatched-preview.gpg /tmp/getpatched-preview-key.asc
          curl --fail --silent --show-error --retry 5 --retry-all-errors --output /tmp/getpatched-preview-InRelease "$GETPATCHED_PREVIEW_REPOSITORY_BASE/dists/focal/InRelease"
          gpgv --keyring /usr/share/keyrings/getpatched-preview.gpg /tmp/getpatched-preview-InRelease
          cat >/etc/apt/sources.list.d/getpatched-preview.list <<EOF
          deb [arch=amd64 signed-by=/usr/share/keyrings/getpatched-preview.gpg] $GETPATCHED_PREVIEW_REPOSITORY_BASE focal main
          deb-src [arch=amd64 signed-by=/usr/share/keyrings/getpatched-preview.gpg] $GETPATCHED_PREVIEW_REPOSITORY_BASE focal main
          EOF
          apt-get update
          apt-cache show getpatched-preview-smoke | grep -F "Version: $GETPATCHED_PREVIEW_VERSION"
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends "getpatched-preview-smoke=$GETPATCHED_PREVIEW_VERSION"
          getpatched-preview-smoke | grep -Fx "GetPatched isolated public preview package: $GETPATCHED_PREVIEW_VERSION"
          dpkg-query -W -f='${Status} ${Version}\n' getpatched-preview-smoke | grep -F "install ok installed $GETPATCHED_PREVIEW_VERSION"
          mkdir -p /tmp/getpatched-preview-source
          cd /tmp/getpatched-preview-source
          apt-get source getpatched-preview-smoke
          find /tmp/getpatched-preview-source -path '*/usr/bin/getpatched-preview-smoke' -type f -print -quit | grep -q .
